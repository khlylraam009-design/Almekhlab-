/* ============================= APP ============================= */

function App() {
  const [products, setProducts] = useState([]);
  const [activeTab, setActiveTab] = useState('products');
  const [selectedProduct, setSelectedProduct] = useState(null);
  const [editingProduct, setEditingProduct] = useState(null);
  const [scannedBarcode, setScannedBarcode] = useState(null);

  const [isScannerOpen, setIsScannerOpen] = useState(false);
  const [isInstallModalOpen, setIsInstallModalOpen] = useState(false);
  const [isPrintModalOpen, setIsPrintModalOpen] = useState(false);
  const [printTargetProduct, setPrintTargetProduct] = useState(null);
  const [isRefreshing, setIsRefreshing] = useState(false);
  const [storageStatus, setStorageStatus] = useState({ itemCount: 0 });

  const [notification, setNotification] = useState(null);

  useEffect(() => { fetchProducts(); }, []);

  const showNotification = (message, type) => {
    setNotification({ message, type: type || 'info' });
    setTimeout(() => setNotification((prev) => (prev && prev.message === message ? null : prev)), 4000);
  };

  const fetchProducts = async () => {
    setIsRefreshing(true);
    try {
      const res = await api.getProducts();
      setProducts(res.products);
      setStorageStatus(res.storageStatus);
    } finally { setIsRefreshing(false); }
  };

  const handleSaveProduct = async (productData) => {
    try {
      const result = await api.saveProduct(productData);
      if (result.success) {
        soundFX.playScanBeep();
        showNotification(`تم حفظ بيانات "${result.product.name}" محلياً على جهازك`, 'success');
        await fetchProducts();
        setSelectedProduct(result.product);
        setEditingProduct(null);
        setActiveTab('details');
      }
    } catch (e) { soundFX.playError(); showNotification('حدث خطأ أثناء حفظ المنتج', 'error'); }
  };

  const handleDeleteProduct = async (product) => {
    try {
      await api.deleteProduct(product.id);
      showNotification(`تم حذف المنتج "${product.name}"`, 'info');
      await fetchProducts();
      if (selectedProduct && selectedProduct.id === product.id) { setSelectedProduct(null); setActiveTab('products'); }
    } catch (e) { showNotification('تعذر حذف المنتج', 'error'); }
  };

  const handleQuickStockChange = async (product, delta) => {
    const newStock = Math.max(0, product.stockQuantity + delta);
    const updated = { ...product, stockQuantity: newStock };
    setProducts((prev) => prev.map((p) => (p.id === product.id ? updated : p)));
    if (selectedProduct && selectedProduct.id === product.id) setSelectedProduct(updated);
    await api.saveProduct({ id: product.id, barcode: product.barcode, stockQuantity: newStock });
  };

  const handleScanSuccess = (barcode, format, existingProduct) => {
    const cleanCode = normalizeBarcode(barcode);
    setScannedBarcode(cleanCode);
    setIsScannerOpen(false);
    const matched = existingProduct || findProductByBarcode(products, cleanCode);
    if (matched) {
      soundFX.playScanBeep();
      setSelectedProduct(matched);
      setActiveTab('details');
      showNotification(`تم العثور على المنتج: ${matched.name}`, 'success');
    } else {
      soundFX.playClick();
      setEditingProduct({ barcode: cleanCode, barcodeFormat: format || 'EAN_13' });
      setActiveTab('add');
      showNotification(`باركود جديد: ${cleanCode}. أكمل بيانات المنتج.`, 'info');
    }
  };

  const handleResetData = async () => {
    setIsRefreshing(true);
    const defaults = await api.resetProducts();
    setProducts(defaults);
    setIsRefreshing(false);
    showNotification('تم استعادة البيانات الافتراضية', 'success');
    setActiveTab('products');
  };

  const handleImportData = async (imported) => {
    setIsRefreshing(true);
    const result = await api.importProducts(imported);
    setProducts(result);
    setIsRefreshing(false);
    showNotification(`تم استيراد ${result.length} منتج بنجاح`, 'success');
    setActiveTab('products');
  };

  return (
    <div className="min-h-screen bg-[#0A0A0A] font-sans text-[#F5F5F5]">
      {notification && (
        <div className="fixed top-16 inset-x-4 z-50 max-w-md mx-auto">
          <div className={`p-3.5 rounded-2xl shadow-xl flex items-center justify-between gap-3 text-xs font-bold border dir-rtl ${notification.type === 'success' ? 'bg-emerald-950/90 text-emerald-300 border-emerald-700/80' : 'bg-[#1A1A1A] text-[#F5F5F5] border-[#C4A484]/50'}`}>
            <div className="flex items-center gap-2"><CheckCircle2 className="w-5 h-5 text-emerald-400 shrink-0" /><span>{notification.message}</span></div>
            <button onClick={() => setNotification(null)}><X className="w-4 h-4 text-[#888888]" /></button>
          </div>
        </div>
      )}

      <HeaderBar
        storageStatus={storageStatus}
        activeTab={activeTab}
        setActiveTab={setActiveTab}
        onRefresh={fetchProducts}
        onOpenScanner={() => setIsScannerOpen(true)}
        onOpenAdd={() => { setEditingProduct(null); setActiveTab('add'); }}
        onOpenInstallModal={() => setIsInstallModalOpen(true)}
        onOpenPrintModal={() => { setPrintTargetProduct(null); setIsPrintModalOpen(true); }}
        itemCount={products.length}
        isRefreshing={isRefreshing}
      />

      <main className="max-w-md mx-auto">
        {activeTab === 'products' && (
          <ProductList products={products} onSelectProduct={(p) => { setSelectedProduct(p); setActiveTab('details'); }}
            onEditProduct={(p) => { setEditingProduct(p); setActiveTab('edit'); }} onDeleteProduct={handleDeleteProduct}
            onQuickStockChange={handleQuickStockChange} onPrintProduct={(p) => { setPrintTargetProduct(p); setIsPrintModalOpen(true); }}
            onOpenAdd={() => { setEditingProduct(null); setActiveTab('add'); }} onOpenScanner={() => setIsScannerOpen(true)}
            onRefresh={fetchProducts} isRefreshing={isRefreshing} />
        )}

        {activeTab === 'search' && (
          <ProductSearch products={products} onSelectProduct={(p) => { setSelectedProduct(p); setActiveTab('details'); }}
            onEditProduct={(p) => { setEditingProduct(p); setActiveTab('edit'); }} onDeleteProduct={handleDeleteProduct}
            onQuickStockChange={handleQuickStockChange} onOpenScanner={() => setIsScannerOpen(true)} />
        )}

        {(activeTab === 'add' || activeTab === 'edit') && (
          <ProductForm initialProduct={editingProduct} scannedBarcode={scannedBarcode || undefined} onSave={handleSaveProduct}
            onCancel={() => { setEditingProduct(null); setActiveTab('products'); }} onOpenScanner={() => setIsScannerOpen(true)}
            existingBarcodes={products.map((p) => p.barcode)} />
        )}

        {activeTab === 'details' && selectedProduct && (
          <ProductDetails product={selectedProduct} onBack={() => setActiveTab('products')} onEdit={(p) => { setEditingProduct(p); setActiveTab('edit'); }}
            onDelete={handleDeleteProduct} onStockUpdate={(p, newStock) => handleQuickStockChange(p, newStock - p.stockQuantity)}
            onPrint={(p) => { setPrintTargetProduct(p); setIsPrintModalOpen(true); }} />
        )}

        {activeTab === 'stats' && (
          <StatsModal products={products} storageStatus={storageStatus} onRefresh={fetchProducts} onResetData={handleResetData} onImportData={handleImportData} />
        )}
      </main>

      {isScannerOpen && (
        <ScannerModal products={products} onScanSuccess={handleScanSuccess} onClose={() => setIsScannerOpen(false)}
          onNavigateToAdd={(code) => { setIsScannerOpen(false); setEditingProduct({ barcode: code }); setActiveTab('add'); }} />
      )}

      <InstallAppModal isOpen={isInstallModalOpen} onClose={() => setIsInstallModalOpen(false)} />
      <PrintBarcodeModal isOpen={isPrintModalOpen} onClose={() => setIsPrintModalOpen(false)} selectedProduct={printTargetProduct} products={products} />

      <BottomNav activeTab={activeTab} setActiveTab={setActiveTab} onOpenScanner={() => setIsScannerOpen(true)} itemCount={products.length} />
    </div>
  );
}

const root = createRoot(document.getElementById('root'));
root.render(<App />);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
