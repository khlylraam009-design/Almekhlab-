function normalizeBarcode(barcode) {
  if (!barcode) return '';
  let normalized = String(barcode).trim();
  normalized = normalized.replace(/[٠-٩]/g, (d) => String(d.charCodeAt(0) - 0x0660));
  normalized = normalized.replace(/[۰-۹]/g, (d) => String(d.charCodeAt(0) - 0x06f0));
  normalized = normalized.replace(/[\s\-\/\t\r\n\u200B-\u200D\uFEFF]/g, '');
  return normalized;
}

function areBarcodesMatching(code1, code2) {
  const norm1 = normalizeBarcode(code1);
  const norm2 = normalizeBarcode(code2);
  if (!norm1 || !norm2) return false;
  if (norm1 === norm2) return true;
  if (norm1.toLowerCase() === norm2.toLowerCase()) return true;
  const noZero1 = norm1.replace(/^0+/, '');
  const noZero2 = norm2.replace(/^0+/, '');
  if (noZero1 && noZero2 && noZero1.toLowerCase() === noZero2.toLowerCase()) return true;
  return false;
}

function findProductByBarcode(products, scannedBarcode) {
  if (!scannedBarcode) return undefined;
  return products.find((p) => areBarcodesMatching(p.barcode, scannedBarcode));
}

class SoundFX {
  getContext() {
    if (typeof window === 'undefined') return null;
    if (!this.ctx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) this.ctx = new AudioContextClass();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  }
  playScanBeep() {
    try {
      const ctx = this.getContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1800, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(2400, ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.08);
    } catch (e) {}
  }
  playClick() {
    try {
      const ctx = this.getContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.04);
    } catch (e) {}
  }
  playError() {
    try {
      const ctx = this.getContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.setValueAtTime(180, ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.18);
    } catch (e) {}
  }
}

/* ============================= LOCAL STORAGE (IndexedDB only) ============================= */

const DB_NAME = 'SijilliLocalDB';
const DB_VERSION = 1;
let dbPromise = null;

function getDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (typeof window === 'undefined' || !window.indexedDB) {
      reject(new Error('IndexedDB غير مدعوم في هذا المتصفح'));
      return;
    }
    const request = indexedDB.open(DB_NAME, DB_VERSION);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains('products')) {
        const store = db.createObjectStore('products', { keyPath: 'id' });
        store.createIndex('barcode', 'barcode', { unique: false });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  return dbPromise;
}

async function getAllProductsFromIDB() {
  try {
    const db = await getDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('products', 'readonly');
      const req = tx.objectStore('products').getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { console.warn(e); return []; }
}

async function saveProductToIDB(product) {
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('products', 'readwrite');
    tx.objectStore('products').put(product);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function saveProductsBatchToIDB(products) {
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('products', 'readwrite');
    const store = tx.objectStore('products');
    products.forEach((p) => store.put(p));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function deleteProductFromIDB(id) {
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('products', 'readwrite');
    tx.objectStore('products').delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function clearProductsIDB() {
  const db = await getDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('products', 'readwrite');
    tx.objectStore('products').clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ============================= LOCAL API (fully offline) ============================= */

const api = {
  async getProducts() {
    let local = await getAllProductsFromIDB();
    if (!local || local.length === 0) {
      await saveProductsBatchToIDB(INITIAL_PRODUCTS);
      local = INITIAL_PRODUCTS;
    }
    return { products: local, storageStatus: { itemCount: local.length } };
  },

  async saveProduct(productData) {
    const local = await getAllProductsFromIDB();
    const now = new Date().toISOString();
    const cleanBarcode = normalizeBarcode(productData.barcode);

    const existingIdx = local.findIndex(
      (p) => (productData.id && p.id === productData.id) || areBarcodesMatching(p.barcode, cleanBarcode)
    );

    let saved, isNew;
    if (existingIdx >= 0) {
      isNew = false;
      saved = { ...local[existingIdx], ...productData, barcode: cleanBarcode || local[existingIdx].barcode, updatedAt: now };
    } else {
      isNew = true;
      saved = {
        id: productData.id || ('prod-' + Date.now()),
        barcode: cleanBarcode,
        barcodeFormat: productData.barcodeFormat || 'EAN_13',
        name: (productData.name || '').trim(),
        description: productData.description || '',
        imageUrl: productData.imageUrl || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&auto=format&fit=crop&q=80',
        piecePrice: Number(productData.piecePrice) || 0,
        dozenPrice: Number(productData.dozenPrice) || 0,
        cartonPrice: Number(productData.cartonPrice) || 0,
        piecesPerDozen: Number(productData.piecesPerDozen) || 12,
        dozensPerCarton: Number(productData.dozensPerCarton) || 10,
        stockQuantity: Number(productData.stockQuantity) || 0,
        category: productData.category || 'عام',
        createdAt: now, updatedAt: now,
      };
    }
    await saveProductToIDB(saved);
    return { success: true, product: saved, isNew };
  },

  async deleteProduct(id) {
    await deleteProductFromIDB(id);
    return true;
  },

  async resetProducts() {
    await clearProductsIDB();
    await saveProductsBatchToIDB(INITIAL_PRODUCTS);
    return INITIAL_PRODUCTS;
  },

  async importProducts(products) {
    await clearProductsIDB();
    await saveProductsBatchToIDB(products);
    return products;
  },
};

/* ============================= BARCODE VISUAL (deterministic pseudo-bars) ============================= */

function BarcodeBars({ code, className }) {
  const digits = (code || '000000000000').split('');
  const bars = digits.map((d, i) => {
    const w = 2 + (parseInt(d, 10) % 4 || 1);
    return React.createElement('rect', {
      key: i, x: i * 6 + 2, y: 0, width: w, height: 40, fill: '#000',
    });
  });
  return React.createElement(
    'svg', { className: className || 'w-full h-full', viewBox: '0 0 120 40', preserveAspectRatio: 'none' },
    bars
  );
}

            <span className="absolute -top-1 -right-2 bg-[#C4A484] text-[#0A0A0A] text-[9px] font-mono font-bold px-1.5 rounded-full">{itemCount}</span>
          </div>
          <span className="text-[10px]">المنتجات</span>
        </button>

        <button onClick={() => handleTabClick('search')}
          className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'search' ? 'text-[#C4A484] font-extrabold scale-105' : 'text-[#666666] hover:text-[#A0A0A0]'}`}>
          <Search className="w-5 h-5" />
          <span className="text-[10px]">البحث</span>
        </button>

        <div className="-mt-7">
          <button onClick={() => { soundFX.playClick(); onOpenScanner(); }}
            className="w-14 h-14 rounded-full bg-[#C4A484] text-[#0A0A0A] flex items-center justify-center shadow-lg shadow-[#C4A484]/20 hover:scale-110 hover:brightness-110 active:scale-95 transition-all border-4 border-[#0E0E0E]"
            title="فتح ماسح الباركود">
            <ScanBarcode className="w-7 h-7" />
          </button>
        </div>

        <button onClick={() => handleTabClick('stats')}
          className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'stats' ? 'text-[#C4A484] font-extrabold scale-105' : 'text-[#666666] hover:text-[#A0A0A0]'}`}>
          <Database className="w-5 h-5" />
          <span className="text-[10px]">البيانات</span>
        </button>
      </div>
    </nav>
  );
}

/* ============================= COMPONENT: ProductCard ============================= */

function ProductCard({ product, onSelect, onEdit, onDelete, onQuickStockChange, onPrint }) {
  const isOutOfStock = product.stockQuantity <= 0;
  const isLowStock = product.stockQuantity > 0 && product.stockQuantity <= 10;
  const isGoodStock = product.stockQuantity > 10;

  return (
    <div className={`bg-[#161616] rounded-2xl border border-[#2A2A2A] hover:border-[#3A3A3A] transition-all duration-200 overflow-hidden flex flex-col group relative ${isGoodStock ? 'border-b-4 border-b-green-600/80' : isLowStock ? 'border-b-4 border-b-amber-600/80' : 'border-b-4 border-b-red-600/80'}`}>
      <div className="relative aspect-[16/9] bg-[#222222] overflow-hidden cursor-pointer" onClick={() => onSelect(product)}>
        <img src={product.imageUrl} alt={product.name}
          className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300 opacity-90"
          onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&auto=format&fit=crop&q=80'; }} />
        <div className="absolute inset-0 bg-gradient-to-t from-[#0A0A0A] via-transparent to-transparent opacity-90" />
        <div className="absolute top-2.5 right-2.5">
          {isGoodStock && <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[10px] font-bold bg-green-600 text-white shadow-sm"><CheckCircle className="w-3 h-3" /><span>متوفر: {product.stockQuantity}</span></span>}
          {isLowStock && <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[10px] font-bold bg-amber-600 text-white shadow-sm animate-pulse"><AlertTriangle className="w-3 h-3" /><span>منخفض: {product.stockQuantity}</span></span>}
          {isOutOfStock && <span className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[10px] font-bold bg-red-600 text-white shadow-sm"><XCircle className="w-3 h-3" /><span>نفد المخزون</span></span>}
        </div>
        <div className="absolute bottom-2.5 right-2.5 left-2.5 flex items-center justify-between">
          <span className="inline-flex items-center gap-1 bg-[#0A0A0A]/85 backdrop-blur-md text-[#C4A484] text-[10px] font-mono font-bold px-2 py-0.5 rounded border border-[#2A2A2A]">
            <Barcode className="w-3 h-3 text-[#C4A484]" /><span className="dir-ltr">{product.barcode}</span>
          </span>
          {product.category && <span className="text-[10px] font-bold text-[#888888] bg-[#0E0E0E]/80 px-2 py-0.5 rounded border border-[#2A2A2A]">{product.category}</span>}
        </div>
      </div>

      <div className="p-3.5 flex-1 flex flex-col justify-between">
        <div className="cursor-pointer" onClick={() => onSelect(product)}>
          <div className="text-[10px] text-[#C4A484] font-serif italic uppercase tracking-widest mb-0.5">{product.barcodeFormat || 'EAN-13'}: {product.barcode}</div>
          <h3 className="font-bold text-[#F5F5F5] text-sm leading-snug line-clamp-1 group-hover:text-[#C4A484] transition-colors">{product.name}</h3>
          <p className="text-xs text-[#888888] mt-1 line-clamp-1 leading-relaxed">{product.description || 'لا يوجد وصف للمنتج'}</p>
        </div>

        <div className="mt-3 pt-3 border-t border-[#2A2A2A] grid grid-cols-3 gap-1.5 text-center">
          <div className="bg-[#1F1F1F] rounded-xl p-1.5 border border-[#2A2A2A]">
            <span className="text-[10px] font-semibold text-[#888888] block">الحبة</span>
            <span className="text-xs font-extrabold text-[#F5F5F5] font-mono dir-ltr">{product.piecePrice.toFixed(2)} <span className="text-[9px] font-sans text-[#888888]">ر.س</span></span>
          </div>
          <div className="bg-[#1F1F1F] rounded-xl p-1.5 border border-[#2A2A2A]">
            <span className="text-[10px] font-semibold text-[#C4A484] block">الدرزن ({product.piecesPerDozen})</span>
            <span className="text-xs font-extrabold text-[#C4A484] font-mono dir-ltr">{product.dozenPrice.toFixed(2)} <span className="text-[9px] font-sans text-[#888888]">ر.س</span></span>
          </div>
          <div className="bg-[#1F1F1F] rounded-xl p-1.5 border border-[#2A2A2A]">
            <span className="text-[10px] font-semibold text-[#888888] block">الكرتون ({product.piecesPerDozen * product.dozensPerCarton})</span>
            <span className="text-xs font-extrabold text-[#F5F5F5] font-mono dir-ltr">{product.cartonPrice.toFixed(2)} <span className="text-[9px] font-sans text-[#888888]">ر.س</span></span>
          </div>
        </div>

        <div className="mt-3 pt-2 flex items-center justify-between gap-1 border-t border-[#2A2A2A]">
          {onQuickStockChange && (
            <div className="flex items-center gap-1 bg-[#1F1F1F] rounded-xl p-0.5 border border-[#2A2A2A]">
              <button onClick={(e) => { e.stopPropagation(); onQuickStockChange(product, -1); }} disabled={product.stockQuantity <= 0}
                className="w-6 h-6 rounded-lg bg-[#2A2A2A] flex items-center justify-center text-[#F5F5F5] hover:bg-[#3A3A3A] disabled:opacity-30 transition-all" title="إنقاص المخزون">
                <Minus className="w-3.5 h-3.5" />
              </button>
              <span className="px-1.5 text-xs font-extrabold font-mono text-[#C4A484] min-w-[20px] text-center">{product.stockQuantity}</span>
              <button onClick={(e) => { e.stopPropagation(); onQuickStockChange(product, 1); }}
                className="w-6 h-6 rounded-lg bg-[#C4A484] text-[#0A0A0A] flex items-center justify-center hover:brightness-110 transition-all font-bold" title="زيادة المخزون">
                <Plus className="w-3.5 h-3.5" />
              </button>
            </div>
          )}
          <div className="flex items-center gap-1">
            {onPrint && <button onClick={(e) => { e.stopPropagation(); onPrint(product); }} className="p-1.5 rounded-lg text-[#C4A484] hover:bg-[#222222] transition-all" title="طباعة ملصق الباركود"><Printer className="w-4 h-4" /></button>}
            <button onClick={() => onSelect(product)} className="p-1.5 rounded-lg text-[#888888] hover:text-[#C4A484] hover:bg-[#222222] transition-all" title="عرض التفاصيل"><Eye className="w-4 h-4" /></button>
            <button onClick={() => onEdit(product)} className="p-1.5 rounded-lg text-[#888888] hover:text-[#C4A484] hover:bg-[#222222] transition-all" title="تعديل المنتج"><Edit2 className="w-4 h-4" /></button>
            <button onClick={() => onDelete(product)} className="p-1.5 rounded-lg text-[#888888] hover:text-red-400 hover:bg-red-950/40 transition-all" title="حذف المنتج"><Trash2 className="w-4 h-4" /></button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ============================= COMPONENT: ProductList ============================= */

function ProductList({ products, onSelectProduct, onEditProduct, onDeleteProduct, onQuickStockChange, onPrintProduct, onOpenAdd, onRefresh, isRefreshing }) {
  const [selectedCategory, setSelectedCategory] = useState('ALL');
  const [stockFilter, setStockFilter] = useState('ALL');
  const [sortBy, setSortBy] = useState('NEWEST');

  const categories = Array.from(new Set(products.map((p) => p.category || 'عام')));

  const filteredProducts = products.filter((p) => {
    if (selectedCategory !== 'ALL' && (p.category || 'عام') !== selectedCategory) return false;
    if (stockFilter === 'GOOD' && p.stockQuantity <= 10) return false;
    if (stockFilter === 'LOW' && (p.stockQuantity > 10 || p.stockQuantity <= 0)) return false;
    if (stockFilter === 'OUT' && p.stockQuantity > 0) return false;
    return true;
  });

  const sortedProducts = [...filteredProducts].sort((a, b) => {
    if (sortBy === 'NEWEST') return new Date(b.createdAt).getTime() - new Date(a.createdAt).getTime();
    if (sortBy === 'PRICE_HIGH') return b.piecePrice - a.piecePrice;
    if (sortBy === 'PRICE_LOW') return a.piecePrice - b.piecePrice;
    if (sortBy === 'STOCK_HIGH') return b.stockQuantity - a.stockQuantity;
    if (sortBy === 'STOCK_LOW') return a.stockQuantity - b.stockQuantity;
    return 0;
  });

  const totalCount = products.length;
  const lowStockCount = products.filter((p) => p.stockQuantity > 0 && p.stockQuantity <= 10).length;
  const outOfStockCount = products.filter((p) => p.stockQuantity <= 0).length;

  return (
    <div className="pb-28 animate-fadeIn dir-rtl min-h-[calc(100vh-60px)]">
      <div className={`bg-[#C4A484] text-[#0A0A0A] text-xs font-bold text-center transition-all duration-300 overflow-hidden flex items-center justify-center gap-2 ${isRefreshing ? 'py-2.5 opacity-100' : 'h-0 opacity-0'}`}>
        <RefreshCw className="w-4 h-4 animate-spin text-[#0A0A0A]" />
        <span>جاري تحديث القائمة...</span>
      </div>

      <div className="max-w-md mx-auto p-4 space-y-4">
        <div className="grid grid-cols-3 gap-2">
          <button onClick={() => setStockFilter('ALL')} className={`p-2.5 rounded-2xl border transition-all text-center flex flex-col items-center ${stockFilter === 'ALL' ? 'bg-[#C4A484] text-[#0A0A0A] border-[#C4A484] font-bold' : 'bg-[#161616] text-[#F5F5F5] border-[#2A2A2A] hover:bg-[#1A1A1A]'}`}>
            <span className="text-[10px] font-bold block opacity-80">إجمالي المنتجات</span>
            <span className="text-base font-black font-mono">{totalCount}</span>
          </button>
          <button onClick={() => setStockFilter('LOW')} className={`p-2.5 rounded-2xl border transition-all text-center flex flex-col items-center ${stockFilter === 'LOW' ? 'bg-amber-600 text-white border-amber-600 font-bold' : 'bg-[#161616] text-amber-400 border-[#2A2A2A] hover:bg-[#1A1A1A]'}`}>
            <span className="text-[10px] font-extrabold block">مخزون منخفض (≤10)</span>
            <span className="text-base font-black font-mono">{lowStockCount}</span>
          </button>
          <button onClick={() => setStockFilter('OUT')} className={`p-2.5 rounded-2xl border transition-all text-center flex flex-col items-center ${stockFilter === 'OUT' ? 'bg-rose-600 text-white border-rose-600 font-bold' : 'bg-[#161616] text-rose-400 border-[#2A2A2A] hover:bg-[#1A1A1A]'}`}>
            <span className="text-[10px] font-extrabold block">نفد المخزون</span>
            <span className="text-base font-black font-mono">{outOfStockCount}</span>
          </button>
        </div>

        <div className="flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-none">
          <button onClick={() => setSelectedCategory('ALL')} className={`px-3.5 py-1.5 rounded-xl text-xs font-bold shrink-0 transition-all border ${selectedCategory === 'ALL' ? 'bg-[#C4A484] text-[#0A0A0A] border-[#C4A484]' : 'bg-[#161616] text-[#A0A0A0] border-[#2A2A2A] hover:bg-[#1A1A1A]'}`}>الكل ({products.length})</button>
          {categories.map((cat) => {
            const count = products.filter((p) => (p.category || 'عام') === cat).length;
            return (
              <button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-3.5 py-1.5 rounded-xl text-xs font-bold shrink-0 transition-all border ${selectedCategory === cat ? 'bg-[#C4A484] text-[#0A0A0A] border-[#C4A484]' : 'bg-[#161616] text-[#A0A0A0] border-[#2A2A2A] hover:bg-[#1A1A1A]'}`}>{cat} ({count})</button>
            );
          })}
        </div>

        <div className="flex items-center justify-between gap-2 text-xs">
          <div className="flex items-center gap-1.5 text-[#888888]">
            <ArrowUpDown className="w-3.5 h-3.5 text-[#C4A484]" />
            <span className="font-bold">الترتيب:</span>
            <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="bg-[#161616] border border-[#2A2A2A] rounded-xl px-2 py-1 font-bold text-[#F5F5F5] focus:outline-none">
              <option value="NEWEST">الأحدث إضافة</option>
              <option value="PRICE_HIGH">الأعلى سعراً</option>
              <option value="PRICE_LOW">الأقل سعراً</option>
              <option value="STOCK_HIGH">الأعلى مخزوناً</option>
              <option value="STOCK_LOW">الأقل مخزوناً</option>
            </select>
          </div>
          <button onClick={() => { soundFX.playClick(); onRefresh(); }} className="flex items-center gap-1 text-[11px] font-bold text-[#888888] hover:text-[#F5F5F5] bg-[#161616] border border-[#2A2A2A] px-2.5 py-1 rounded-xl" title="تحديث البيانات">
            <RefreshCw className={`w-3 h-3 ${isRefreshing ? 'animate-spin text-[#C4A484]' : ''}`} /><span>تحديث</span>
          </button>
        </div>

        {sortedProducts.length > 0 ? (
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            {sortedProducts.map((product) => (
              <ProductCard key={product.id} product={product} onSelect={onSelectProduct} onEdit={onEditProduct} onDelete={onDeleteProduct} onQuickStockChange={onQuickStockChange} onPrint={onPrintProduct} />
            ))}
          </div>
        ) : (
          <div className="bg-[#161616] rounded-3xl border border-[#2A2A2A] p-8 text-center space-y-3 my-6">
            <div className="w-16 h-16 rounded-full bg-[#1A1A1A] border border-[#2A2A2A] text-[#C4A484] flex items-center justify-center mx-auto"><Package className="w-8 h-8" /></div>
            <h3 className="font-extrabold text-[#F5F5F5] text-base">لا توجد منتجات مطابقة</h3>
            <p className="text-xs text-[#888888] max-w-xs mx-auto">لم نجد منتجات تطابق خيارات التصفية المحددة. يمكنك إضافة منتج جديد بسهولة!</p>
            <button onClick={onOpenAdd} className="inline-flex items-center gap-1.5 px-5 py-2.5 bg-[#C4A484] hover:brightness-110 text-[#0A0A0A] font-bold text-xs rounded-xl shadow-md transition-all active:scale-95"><Plus className="w-4 h-4" /><span>إضافة منتج جديد</span></button>
          </div>
        )}
      </div>

      <button onClick={() => { soundFX.playClick(); onOpenAdd(); }}
        className="fixed bottom-20 left-6 z-40 w-14 h-14 rounded-full bg-[#C4A484] text-[#0A0A0A] flex items-center justify-center shadow-xl shadow-[#C4A484]/20 hover:scale-105 hover:brightness-110 transition-all active:scale-95 border-2 border-[#0A0A0A]" title="إضافة منتج جديد">
        <Plus className="w-7 h-7" />
      </button>
    </div>
  );
}

/* ============================= COMPONENT: ProductSearch ============================= */

function ProductSearch({ products, onSelectProduct, onEditProduct, onDeleteProduct, onQuickStockChange, onOpenScanner }) {
  const [query, setQuery] = useState('');
  const cleanQuery = query.trim().toLowerCase();
  const results = cleanQuery
    ? products.filter((p) => p.name.toLowerCase().includes(cleanQuery) || p.barcode.toLowerCase().includes(cleanQuery) || p.description.toLowerCase().includes(cleanQuery) || (p.category && p.category.toLowerCase().includes(cleanQuery)))
    : products;

  return (
    <div className="pb-28 animate-fadeIn dir-rtl min-h-screen bg-[#0A0A0A]">
      <div className="bg-[#0E0E0E] border-b border-[#2A2A2A] sticky top-0 z-20 p-4 shadow-xs">
        <div className="max-w-md mx-auto space-y-3">
          <div className="relative flex items-center gap-2">
            <div className="relative flex-1">
              <input type="text" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="ابحث بالاسم، الوصف، أو رقم الباركود..." autoFocus
                className="w-full bg-[#1A1A1A] border border-[#2A2A2A] rounded-2xl pr-10 pl-9 py-3 text-xs font-bold text-[#F5F5F5] placeholder-[#666666] focus:outline-none focus:border-[#C4A484] transition-all" />
              <Search className="w-4 h-4 text-[#888888] absolute right-3.5 top-3.5" />
              {query && <button onClick={() => setQuery('')} className="absolute left-3 top-3.5 text-[#888888] hover:text-[#F5F5F5] p-0.5 rounded-full"><X className="w-4 h-4" /></button>}
            </div>
            <button onClick={onOpenScanner} className="p-3 bg-[#C4A484] hover:brightness-110 text-[#0A0A0A] rounded-2xl transition-all shadow-sm shrink-0 active:scale-95 font-bold" title="مسح باركود مباشرة">
              <ScanBarcode className="w-5 h-5 text-[#0A0A0A]" />
            </button>
          </div>
          <div className="flex items-center justify-between text-xs text-[#888888] font-bold px-1">
            <span>{cleanQuery ? `نتائج البحث (${results.length} منتج)` : `عرض جميع المنتجات (${products.length})`}</span>
            {cleanQuery && <button onClick={() => setQuery('')} className="text-[#C4A484] underline text-[11px]">إعادة ضبط البحث</button>}
          </div>
        </div>
      </div>

      <div className="max-w-md mx-auto p-4">
        {results.length > 0 ? (
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            {results.map((product) => (
              <ProductCard key={product.id} product={product} onSelect={onSelectProduct} onEdit={onEditProduct} onDelete={onDeleteProduct} onQuickStockChange={onQuickStockChange} />
            ))}
          </div>
        ) : (
          <div className="bg-[#161616] rounded-3xl border border-[#2A2A2A] p-8 text-center space-y-3 my-8">
            <div className="w-16 h-16 rounded-full bg-[#1A1A1A] border border-[#2A2A2A] text-[#C4A484] flex items-center justify-center mx-auto"><Search className="w-8 h-8" /></div>
            <h3 className="font-extrabold text-[#F5F5F5] text-base">لم يتم العثور على نتائج</h3>
            <p className="text-xs text-[#888888] max-w-xs mx-auto">لا توجد منتجات تطابق "{query}". يرجى التحقق من رقم الباركود أو الكلمة الرئيسية.</p>
            <button onClick={onOpenScanner} className="inline-flex items-center gap-1.5 px-5 py-2.5 bg-[#C4A484] text-[#0A0A0A] font-bold text-xs rounded-xl shadow-md hover:brightness-110 transition-all active:scale-95"><Barcode className="w-4 h-4" /><span>مسح باركود جديد</span></button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================= COMPONENT: BarcodeGeneratorCard ============================= */

function BarcodeGeneratorCard({ barcode, barcodeFormat, productName, onPrint }) {
  const [copied, setCopied] = useState(false);
  const [viewMode, setViewMode] = useState('BARCODE');

  const handleCopy = () => {
    soundFX.playClick();
    if (navigator.clipboard) { navigator.clipboard.writeText(barcode); setCopied(true); setTimeout(() => setCopied(false), 2000); }
  };

  return (
    <div className="bg-[#161616] rounded-2xl border border-[#2A2A2A] p-4 space-y-3 shadow-xs dir-rtl text-[#F5F5F5]">
      <div className="flex items-center justify-between">
        <h3 className="text-sm font-extrabold flex items-center gap-1.5 text-[#F5F5F5]"><Barcode className="w-4 h-4 text-[#C4A484]" /><span>ملصق الباركود الرقمي</span></h3>
        <div className="flex items-center gap-1 bg-[#1F1F1F] p-1 rounded-xl border border-[#2A2A2A]">
          <button onClick={() => setViewMode('BARCODE')} className={`px-2 py-0.5 rounded-lg text-xs font-bold transition-all ${viewMode === 'BARCODE' ? 'bg-[#C4A484] text-[#0A0A0A]' : 'text-[#888888]'}`}>خطي (1D)</button>
          <button onClick={() => setViewMode('QR')} className={`px-2 py-0.5 rounded-lg text-xs font-bold transition-all ${viewMode === 'QR' ? 'bg-[#C4A484] text-[#0A0A0A]' : 'text-[#888888]'}`}>QR كود (2D)</button>
        </div>
      </div>

      <div className="bg-white rounded-xl p-4 text-center flex flex-col items-center justify-center space-y-2 shadow-inner">
        <span className="text-[11px] font-bold text-neutral-800 truncate max-w-full block">{productName}</span>
        {viewMode === 'BARCODE' ? (
          <div className="w-full max-w-[240px] h-14"><BarcodeBars code={barcode} className="w-full h-full" /></div>
        ) : (
          <div className="w-24 h-24 bg-white p-2 border border-neutral-300 rounded flex items-center justify-center"><QrCode className="w-20 h-20 text-black" /></div>
        )}
        <div className="font-mono text-sm font-black tracking-widest text-black dir-ltr">{barcode}</div>
      </div>

      <div className="flex items-center justify-between gap-2 pt-1">
        <button onClick={handleCopy} className="flex-1 flex items-center justify-center gap-1.5 py-2 px-3 bg-[#1F1F1F] hover:bg-[#2A2A2A] border border-[#2A2A2A] rounded-xl text-xs font-bold text-[#F5F5F5] transition-all">
          {copied ? <Check className="w-3.5 h-3.5 text-emerald-400" /> : <Copy className="w-3.5 h-3.5 text-[#C4A484]" />}<span>{copied ? 'تم النسخ' : 'نسخ الكود'}</span>
        </button>
        {onPrint && <button onClick={onPrint} className="flex-1 flex items-center justify-center gap-1.5 py-2 px-3 bg-[#1F1F1F] hover:bg-[#2A2A2A] border border-[#2A2A2A] rounded-xl text-xs font-bold text-[#C4A484] transition-all"><Printer className="w-3.5 h-3.5" /><span>طباعة الملصق</span></button>}
      </div>
    </div>
  );
}

/* ============================= COMPONENT: ProductDetails ============================= */

function ProductDetails({ product, onBack, onEdit, onDelete, onStockUpdate, onPrint }) {

  const [copied, setCopied] = useState(false);

  const isGoodStock = product.stockQuantity > 10;

  const isOutOfStock = product.stockQuantity <= 0;
  const totalPiecesInCarton = product.piecesPerDozen * product.dozensPerCarton;

  const handleQuickAdjust = (delta) => { soundFX.playClick(); onStockUpdate(product, Math.max(0, product.stockQuantity + delta)); };

  const handleShare = () => {
    soundFX.playClick();
    const text = `منتج: ${product.name}\nالباركود: ${product.barcode}\nسعر الحبة: ${product.piecePrice} ر.س\nالمخزون المتوفر: ${product.stockQuantity}`;
    if (navigator.clipboard) { navigator.clipboard.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 2000); }

        </div>
        <div className="flex items-center gap-1.5">
          {onPrint && <button onClick={() => onPrint(product)} className="p-2 rounded-xl text-[#C4A484] bg-[#1A1A1A] hover:bg-[#222222] border border-[#C4A484]/30 transition-all" title="طباعة ملصق الباركود"><Printer className="w-5 h-5" /></button>}
          <button onClick={handleShare} className="p-2 rounded-xl text-[#888888] hover:bg-[#1A1A1A] hover:text-[#C4A484] transition-all" title="مشاركة تفاصيل المنتج"><Share2 className="w-5 h-5" /></button>
          <button onClick={() => onEdit(product)} className="flex items-center gap-1 px-3 py-1.5 bg-[#1A1A1A] text-[#C4A484] border border-[#2A2A2A] rounded-xl font-bold text-xs hover:bg-[#222222] transition-all"><Edit2 className="w-3.5 h-3.5" /><span>تعديل</span></button>
          <button onClick={() => setShowDeleteModal(true)} className="p-1.5 bg-rose-950/40 text-rose-400 border border-rose-800/40 rounded-xl hover:bg-rose-900/60 transition-all" title="حذف المنتج"><Trash2 className="w-4 h-4" /></button>
        </div>
      </div>

      {copied && <div className="bg-[#C4A484] text-[#0A0A0A] text-xs font-bold text-center py-2 shadow-sm animate-fadeIn">تم نسخ بيانات المنتج إلى الحافظة!</div>}

      <div className="max-w-md mx-auto p-4 space-y-4">
        <div className="bg-[#161616] rounded-3xl border border-[#2A2A2A] overflow-hidden shadow-xs">
          <div className="relative aspect-[16/10] bg-[#222222]">
            <img src={product.imageUrl} alt={product.name} className="w-full h-full object-cover opacity-90"
              onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&auto=format&fit=crop&q=80'; }} />
            <div className="absolute inset-0 bg-gradient-to-t from-[#0A0A0A] via-transparent to-transparent opacity-90" />
            {product.category && <span className="absolute top-3 right-3 bg-[#0A0A0A]/80 backdrop-blur-md text-[#C4A484] text-xs font-bold px-3 py-1 rounded-full border border-[#2A2A2A]">{product.category}</span>}
          </div>
          <div className="p-4 space-y-2">
            <h1 className="text-lg font-black text-[#F5F5F5] leading-tight">{product.name}</h1>
            <p className="text-xs text-[#888888] leading-relaxed">{product.description || 'لا يوجد وصف تفصيلي لهذا المنتج.'}</p>
          </div>
        </div>

        <BarcodeGeneratorCard barcode={product.barcode} barcodeFormat={product.barcodeFormat} productName={product.name} onPrint={onPrint ? () => onPrint(product) : undefined} />

        <div className="bg-[#161616] rounded-2xl border border-[#2A2A2A] p-4 space-y-3 shadow-xs">
          <div className="flex items-center justify-between">
            <h3 className="text-sm font-extrabold text-[#F5F5F5] flex items-center gap-1.5"><PackageCheck className="w-4 h-4 text-[#C4A484]" /><span>حالة المخزون المتوفر</span></h3>
            {isGoodStock && <span className="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-extrabold bg-green-600 text-white"><CheckCircle className="w-3.5 h-3.5" /><span>متوفر ممتاز (&gt;10)</span></span>}
            {isLowStock && <span className="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-extrabold bg-amber-600 text-white animate-pulse"><AlertTriangle className="w-3.5 h-3.5" /><span>مخزون منخفض (≤10)</span></span>}
            {isOutOfStock && <span className="inline-flex items-center gap-1 px-3 py-1 rounded-full text-xs font-extrabold bg-rose-600 text-white"><XCircle className="w-3.5 h-3.5" /><span>منتهي في المخزن</span></span>}
          </div>

          <div className="bg-[#1F1F1F] p-3 rounded-xl border border-[#2A2A2A] flex items-center justify-between">
            <div>
              <span className="text-xs text-[#888888] block font-semibold">الكمية الحالية:</span>
              <span className="text-2xl font-black font-mono text-[#C4A484]">{product.stockQuantity}</span>
              <span className="text-xs font-bold text-[#888888] mr-1">حبة</span>
            </div>
            <div className="flex items-center gap-1.5">
              <button onClick={() => handleQuickAdjust(-5)} className="w-8 h-8 rounded-xl bg-[#2A2A2A] border border-[#3A3A3A] text-[#F5F5F5] font-bold text-xs hover:bg-[#333333] flex items-center justify-center transition-all" title="-5 حبات">-5</button>
              <button onClick={() => handleQuickAdjust(-1)} className="w-8 h-8 rounded-xl bg-[#2A2A2A] border border-[#3A3A3A] text-[#F5F5F5] font-extrabold text-sm hover:bg-[#333333] flex items-center justify-center transition-all" title="-1 حبة"><Minus className="w-4 h-4" /></button>
              <button onClick={() => handleQuickAdjust(1)} className="w-8 h-8 rounded-xl bg-[#C4A484] text-[#0A0A0A] font-extrabold text-sm hover:brightness-110 flex items-center justify-center transition-all" title="+1 حبة"><Plus className="w-4 h-4" /></button>
              <button onClick={() => handleQuickAdjust(5)} className="w-8 h-8 rounded-xl bg-[#1A1A1A] border border-[#C4A484]/40 text-[#C4A484] font-bold text-xs hover:bg-[#222222] flex items-center justify-center transition-all" title="+5 حبات">+5</button>
            </div>
          </div>
        </div>

        <div className="bg-[#161616] rounded-2xl border border-[#2A2A2A] p-4 space-y-3.5 shadow-xs">
          <h3 className="text-sm font-extrabold text-[#F5F5F5] flex items-center gap-1.5"><Layers className="w-4 h-4 text-[#C4A484]" /><span>تفاصيل الأسعار والتعبئة</span></h3>
          <div className="grid grid-cols-3 gap-2 text-center">
            <div className="bg-[#1F1F1F] p-3 rounded-2xl border border-[#2A2A2A]">
              <span className="text-xs font-bold text-[#888888] block mb-1">سعر الحبة</span>
              <span className="text-base font-black font-mono text-[#F5F5F5] dir-ltr block">{product.piecePrice.toFixed(2)}</span>
              <span className="text-[10px] text-[#888888] font-bold">ر.س / حبة</span>
            </div>
            <div className="bg-[#1F1F1F] p-3 rounded-2xl border border-[#2A2A2A]">
              <span className="text-xs font-bold text-[#C4A484] block mb-1">سعر الدرزن ({product.piecesPerDozen})</span>
              <span className="text-base font-black font-mono text-[#C4A484] dir-ltr block">{product.dozenPrice.toFixed(2)}</span>
              <span className="text-[10px] text-[#C4A484] font-bold">ر.س / درزن</span>
            </div>
            <div className="bg-[#1F1F1F] p-3 rounded-2xl border border-[#2A2A2A]">
              <span className="text-xs font-bold text-[#888888] block mb-1">سعر الكرتون ({totalPiecesInCarton})</span>
              <span className="text-base font-black font-mono text-[#F5F5F5] dir-ltr block">{product.cartonPrice.toFixed(2)}</span>
              <span className="text-[10px] text-[#888888] font-bold">ر.س / كرتون</span>
            </div>
          </div>
          <div className="bg-[#1F1F1F] p-3 rounded-xl border border-[#2A2A2A] space-y-2 text-xs">
            <div className="flex justify-between items-center text-[#888888]"><span>عدد الحبات في الدرزن:</span><span className="font-bold font-mono text-[#F5F5F5]">{product.piecesPerDozen} حبة</span></div>
            <div className="flex justify-between items-center text-[#888888]"><span>عدد الدرزن في الكرتون:</span><span className="font-bold font-mono text-[#F5F5F5]">{product.dozensPerCarton} درزن</span></div>
            <div className="flex justify-between items-center text-[#F5F5F5] font-extrabold pt-1 border-t border-[#2A2A2A]"><span>إجمالي حبات الكرتون الكامل:</span><span className="font-mono text-[#C4A484]">{totalPiecesInCarton} حبة</span></div>
          </div>
        </div>

        <div className="bg-[#161616] rounded-2xl border border-[#2A2A2A] p-3.5 text-xs text-[#888888] space-y-1.5 shadow-xs">
          <div className="flex items-center gap-1.5"><Calendar className="w-3.5 h-3.5 text-[#C4A484]" /><span>تاريخ الإضافة:</span><span className="font-mono text-[#F5F5F5] font-bold dir-ltr">{new Date(product.createdAt).toLocaleDateString('ar-SA')}</span></div>
          <div className="flex items-center gap-1.5"><Calendar className="w-3.5 h-3.5 text-[#C4A484]" /><span>آخر تحديث:</span><span className="font-mono text-[#F5F5F5] font-bold dir-ltr">{new Date(product.updatedAt).toLocaleTimeString('ar-SA')}</span></div>
        </div>
      </div>

      {showDeleteModal && (
        <div className="fixed inset-0 z-50 bg-[#0A0A0A]/85 backdrop-blur-md flex items-center justify-center p-4 animate-fadeIn">
          <div className="bg-[#161616] border border-[#2A2A2A] rounded-3xl p-5 max-w-xs w-full text-center space-y-4 shadow-2xl">
            <div className="w-12 h-12 rounded-full bg-rose-950/60 border border-rose-800/60 text-rose-400 flex items-center justify-center mx-auto"><Trash2 className="w-6 h-6" /></div>
            <div>
              <h3 className="font-extrabold text-[#F5F5F5] text-base">هل أنت متأكد من حذف المنتج؟</h3>
              <p className="text-xs text-[#888888] mt-1">سيتم إزالة منتج "{product.name}" نهائياً من قاعدة البيانات المحلية.</p>
            </div>
            <div className="flex gap-2">
              <button onClick={() => { soundFX.playClick(); onDelete(product); }} className="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl transition-all">تأكيد الحذف</button>
              <button onClick={() => setShowDeleteModal(false)} className="flex-1 py-2.5 bg-[#2A2A2A] hover:bg-[#333333] text-[#F5F5F5] font-bold text-xs rounded-xl transition-all">إلغاء</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================= COMPONENT: ProductForm ============================= */

function ProductForm({ initialProduct, scannedBarcode, onSave, onCancel, onOpenScanner, existingBarcodes }) {
  const isEditMode = Boolean(initialProduct && initialProduct.id);

  const [id, setId] = useState((initialProduct && initialProduct.id) || '');
  const [barcode, setBarcode] = useState((initialProduct && initialProduct.barcode) || scannedBarcode || '');
  const [barcodeFormat, setBarcodeFormat] = useState((initialProduct && initialProduct.barcodeFormat) || 'EAN_13');
  const [name, setName] = useState((initialProduct && initialProduct.name) || '');
  const [description, setDescription] = useState((initialProduct && initialProduct.description) || '');
  const [category, setCategory] = useState((initialProduct && initialProduct.category) || 'عام');
  const [imageUrl, setImageUrl] = useState((initialProduct && initialProduct.imageUrl) || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&auto=format&fit=crop&q=80');
  const [piecePrice, setPiecePrice] = useState(initialProduct && initialProduct.piecePrice !== undefined ? String(initialProduct.piecePrice) : '');
  const [dozenPrice, setDozenPrice] = useState(initialProduct && initialProduct.dozenPrice !== undefined ? String(initialProduct.dozenPrice) : '');
  const [cartonPrice, setCartonPrice] = useState(initialProduct && initialProduct.cartonPrice !== undefined ? String(initialProduct.cartonPrice) : '');
  const [piecesPerDozen, setPiecesPerDozen] = useState(initialProduct && initialProduct.piecesPerDozen !== undefined ? String(initialProduct.piecesPerDozen) : '12');
  const [dozensPerCarton, setDozensPerCarton] = useState(initialProduct && initialProduct.dozensPerCarton !== undefined ? String(initialProduct.dozensPerCarton) : '10');
  const [stockQuantity, setStockQuantity] = useState(initialProduct && initialProduct.stockQuantity !== undefined ? String(initialProduct.stockQuantity) : '0');

  const [errors, setErrors] = useState({});
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [showImagePicker, setShowImagePicker] = useState(false);

  useEffect(() => { if (scannedBarcode && !barcode) setBarcode(scannedBarcode); }, [scannedBarcode]);

  const totalPiecesInCarton = (Number(piecesPerDozen) || 0) * (Number(dozensPerCarton) || 0);

  const handleImageFileChange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onloadend = () => { if (typeof reader.result === 'string') setImageUrl(reader.result); };
      reader.readAsDataURL(file);
    }
  };

  const handleGenerateBarcode = () => {
    const random = '628' + Math.floor(100000000 + Math.random() * 900000000).toString();
    setBarcode(random); setBarcodeFormat('EAN_13');
  };

  const validate = () => {
    const errs = {};
    if (!barcode.trim()) errs.barcode = 'رقم الباركود مطلوب';
    else if (!isEditMode && existingBarcodes.includes(barcode.trim()) && barcode.trim() !== (initialProduct && initialProduct.barcode)) errs.barcode = 'هذا الباركود مسجل مسبقاً لمنتج آخر';
    if (!name.trim()) errs.name = 'اسم المنتج مطلوب';
    if (!piecePrice || isNaN(Number(piecePrice)) || Number(piecePrice) < 0) errs.piecePrice = 'يرجى إدخال سعر حبة صحيح';
    if (!dozenPrice || isNaN(Number(dozenPrice)) || Number(dozenPrice) < 0) errs.dozenPrice = 'يرجى إدخال سعر درزن صحيح';
    if (!cartonPrice || isNaN(Number(cartonPrice)) || Number(cartonPrice) < 0) errs.cartonPrice = 'يرجى إدخال سعر كرتون صحيح';
    if (!stockQuantity || isNaN(Number(stockQuantity)) || Number(stockQuantity) < 0) errs.stockQuantity = 'يرجى إدخال كمية مخزون صحيحة';
    setErrors(errs);
    return Object.keys(errs).length === 0;
  };

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!validate()) { soundFX.playError(); return; }
    setIsSubmitting(true); soundFX.playClick();
    const cleanBarcode = normalizeBarcode(barcode);
    const productPayload = {
      id: id || undefined, barcode: cleanBarcode, barcodeFormat, name: name.trim(), description: description.trim(), category: category.trim(), imageUrl,
      piecePrice: Number(piecePrice), dozenPrice: Number(dozenPrice), cartonPrice: Number(cartonPrice),
      piecesPerDozen: Number(piecesPerDozen) || 12, dozensPerCarton: Number(dozensPerCarton) || 10, stockQuantity: Number(stockQuantity),
    };
    try { await onSave(productPayload); }
    catch (error) { console.error(error); setErrors({ form: 'حدث خطأ أثناء حفظ البيانات' }); }
    finally { setIsSubmitting(false); }
  };

  return (
    <div className="bg-[#0A0A0A] min-h-screen pb-24 animate-fadeIn text-[#F5F5F5]">
      <div className="bg-[#0E0E0E] border-b border-[#2A2A2A] sticky top-0 z-20 px-4 py-3.5 flex items-center justify-between shadow-xs">
        <div className="flex items-center gap-2">
          <button onClick={onCancel} className="p-2 rounded-xl text-[#888888] hover:text-[#F5F5F5] hover:bg-[#1A1A1A] transition-all active:scale-95"><ArrowRight className="w-5 h-5" /></button>
          <div>
            <h2 className="font-extrabold text-[#F5F5F5] text-base">{isEditMode ? 'تعديل بيانات المنتج' : 'إضافة منتج جديد'}</h2>
            <p className="text-xs text-[#888888]">{isEditMode ? `رمز الباركود: ${barcode}` : 'يرجى ملء الحقول المطلوبة'}</p>
          </div>
        </div>
        <button onClick={handleSubmit} disabled={isSubmitting} className="flex items-center gap-1.5 px-4 py-2 bg-[#C4A484] hover:brightness-110 text-[#0A0A0A] font-bold text-xs rounded-xl shadow-md transition-all active:scale-95 disabled:opacity-50">
          {isSubmitting ? <RefreshCw className="w-4 h-4 animate-spin" /> : <Save className="w-4 h-4 text-[#0A0A0A]" />}<span>{isEditMode ? 'حفظ التعديلات' : 'حفظ المنتج'}</span>
        </button>
      </div>

      <div className="max-w-md mx-auto p-4 space-y-4 dir-rtl">
        {errors.form && <div className="p-3 bg-rose-950/60 border border-rose-800/80 text-rose-300 rounded-xl text-xs font-bold flex items-center gap-2"><AlertCircle className="w-4 h-4 shrink-0" /><span>{errors.form}</span></div>}

        <form onSubmit={handleSubmit} className="space-y-4">
          <div className="bg-[#161616] rounded-2xl border border-[#2A2A2A] p-4 space-y-3.5 shadow-xs">
            <div className="flex items-center justify-between">
              <h3 className="text-sm font-extrabold text-[#F5F5F5] flex items-center gap-1.5"><ScanBarcode className="w-4 h-4 text-[#C4A484]" /><span>رمز الباركود والمعلومات الأساسية</span></h3>
              <button type="button" onClick={onOpenScanner} className="flex items-center gap-1 text-xs font-bold text-[#C4A484] bg-[#1A1A1A] border border-[#2A2A2A] px-2.5 py-1 rounded-xl hover:bg-[#222222] transition-all"><Camera className="w-3.5 h-3.5" /><span>مسح بالكاميرا</span></button>
            </div>

            <div>
              <label className="block text-xs font-bold text-[#F5F5F5] mb-1">رقم الباركود <span className="text-rose-500">*</span></label>
              <div className="flex gap-2">
                <input type="text" value={barcode} onChange={(e) => setBarcode(e.target.value)} placeholder="أدخل الباركود..."
                  className={`flex-1 bg-[#1A1A1A] border rounded-xl px-3 py-2.5 text-xs font-mono font-bold text-[#F5F5F5] focus:outline-none dir-ltr text-right ${errors.barcode ? 'border-rose-500' : 'border-[#2A2A2A] focus:border-[#C4A484]'}`} />
                <button type="button" onClick={handleGenerateBarcode} title="توليد باركود تلقائي" className="px-3 py-2 bg-[#1A1A1A] hover:bg-[#222222] border border-[#2A2A2A] text-[#C4A484] text-xs font-bold rounded-xl transition-all">توليد</button>
              </div>
              {errors.barcode && <p className="text-[11px] font-bold text-rose-400 mt-1">{errors.barcode}</p>}
            </div>

            <div>
              <label className="block text-xs font-bold text-[#F5F5F5] mb-1">نوع الباركود (Barcode Format)</label>
              <select value={barcodeFormat} onChange={(e) => setBarcodeFormat(e.target.value)} className="w-full bg-[#1A1A1A] border border-[#2A2A2A] rounded-xl px-3 py-2.5 text-xs font-bold text-[#F5F5F5] focus:outline-none focus:border-[#C4A484]">
                {BARCODE_TYPES.map((bt) => <option key={bt.code} value={bt.code} className="bg-[#161616] text-[#F5F5F5]">{bt.name} — ({bt.description})</option>)}
              </select>
            </div>

            <div>
              <label className="block text-xs font-bold text-[#F5F5F5] mb-1">اسم المنتج <span className="text-rose-500">*</span></label>
              <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="مثال: عصير نادك برتقال طازج 1.5 لتر"
                className={`w-full bg-[#1A1A1A] border rounded-xl px-3 py-2.5 text-xs font-bold text-[#F5F5F5] focus:outline-none ${errors.name ? 'border-rose-500' : 'border-[#2A2A2A] focus:border-[#C4A484]'}`} />
              {errors.name && <p className="text-[11px] font-bold text-rose-400 mt-1">{errors.name}</p>}
            </div>

            <div>
              <label className="block text-xs font-bold text-[#F5F5F5] mb-1">فئة المنتج</label>
              <input type="text" value={category} onChange={(e) => setCategory(e.target.value)} placeholder="مثال: عصائر، ألبان، مواد غذائية..." className="w-full bg-[#1A1A1A] border border-[#2A2A2A] rounded-xl px-3 py-2.5 text-xs font-bold text-[#F5F5F5] focus:outline-none focus:border-[#C4A484]" />
            </div>

            <div>
              <label className="block text-xs font-bold text-[#F5F5F5] mb-1">الوصف والملاحظات</label>
              <textarea value={description} onChange={(e) => setDescription(e.target.value)} rows={2} placeholder="تفاصيل إضافية للمنتج..." className="w-full bg-[#1A1A1A] border border-[#2A2A2A] rounded-xl px-3 py-2 text-xs text-[#F5F5F5] focus:outline-none focus:border-[#C4A484]" />
            </div>
          </div>

          <div className="bg-[#161616] rounded-2xl border border-[#2A2A2A] p-4 space-y-3 shadow-xs">
            <h3 className="text-sm font-extrabold text-[#F5F5F5] flex items-center justify-between">
              <span className="flex items-center gap-1.5"><ImageIcon className="w-4 h-4 text-[#C4A484]" /><span>صورة المنتج</span></span>
              <button type="button" onClick={() => setShowImagePicker(!showImagePicker)} className="text-xs font-bold text-[#C4A484] underline">{showImagePicker ? 'إغلاق المعرض' : 'معرض الصور المجهزة'}</button>
            </h3>

/* ============================= COMPONENT: ScannerModal ============================= */

function ScannerModal({ products, onScanSuccess, onClose, onNavigateToAdd }) {
  const [activeFormat, setActiveFormat] = useState('EAN_13');
  const [manualBarcode, setManualBarcode] = useState('');
  const [isCameraActive, setIsCameraActive] = useState(false);
  const [cameraError, setCameraError] = useState(null);
  const [scannedResult, setScannedResult] = useState(null);
  const scannerRef = useRef(null);
  const scannerContainerId = 'reader-html5-barcode-scanner';

  useEffect(() => {
    let isMounted = true;
    if (!window.Html5Qrcode) { setCameraError('مكتبة الماسح لم تُحمّل. تحقق من اتصال الإنترنت عند أول تشغيل.'); return; }
    window.Html5Qrcode.getCameras()
      .then((devices) => {
        if (isMounted && devices && devices.length > 0) startScanner(devices[devices.length - 1].id);
        else if (isMounted) setCameraError('لم يتم العثور على كاميرا في هذا الجهاز.');
      })
      .catch(() => { if (isMounted) setCameraError('تعذر تشغيل الكاميرا (يرجى التأكد من السماح بالصلاحيات).'); });
    return () => { isMounted = false; stopScanner(); };
  }, []);

  const startScanner = async (cameraId) => {
    try {
      setCameraError(null);
      if (scannerRef.current) await stopScanner();
      const html5Qrcode = new window.Html5Qrcode(scannerContainerId, { verbose: false });
      scannerRef.current = html5Qrcode;
      await html5Qrcode.start(cameraId, { fps: 15, qrbox: { width: 260, height: 180 } },
        (decodedText, decodedResult) => {
          const fmt = (decodedResult && decodedResult.result && decodedResult.result.format && decodedResult.result.format.formatName) || 'UNKNOWN';
          handleDetectedBarcode(decodedText, fmt);
        }, () => {});
      setIsCameraActive(true);
    } catch (err) { setIsCameraActive(false); setCameraError('الكاميرا غير متاحة حالياً.'); }
  };

  const stopScanner = async () => {
    if (scannerRef.current && scannerRef.current.isScanning) {
      try { await scannerRef.current.stop(); await scannerRef.current.clear(); } catch (e) {}
    }
  };

  const handleDetectedBarcode = (rawCode, formatName) => {
    const cleanCode = normalizeBarcode(rawCode);
    if (!cleanCode) return;
    soundFX.playScanBeep();
    const existingProduct = findProductByBarcode(products, cleanCode);
    setScannedResult({ barcode: cleanCode, product: existingProduct || null });
    onScanSuccess(cleanCode, formatName || 'EAN_13', existingProduct);
  };

  const handleManualSubmit = (e) => { e.preventDefault(); if (!manualBarcode.trim()) return; handleDetectedBarcode(manualBarcode.trim(), activeFormat); };
  const handleSelectSampleBarcode = (sampleCode, format) => { setActiveFormat(format); setManualBarcode(sampleCode); handleDetectedBarcode(sampleCode, format); };

  return (
    <div className="fixed inset-0 z-50 bg-[#0A0A0A]/90 backdrop-blur-md flex flex-col justify-between overflow-y-auto animate-fadeIn text-[#F5F5F5]">
      <div className="p-4 flex items-center justify-between text-[#F5F5F5] border-b border-[#2A2A2A] bg-[#0E0E0E]">
        <div className="flex items-center gap-2">
          <ScanBarcode className="w-6 h-6 text-[#C4A484]" />
          <div><h2 className="text-base font-extrabold dir-rtl">ماسح الباركود المباشر</h2><p className="text-[11px] text-[#888888] dir-rtl">وجه الكاميرا نحو الباركود للمسح الفوري</p></div>
        </div>
        <button onClick={onClose} className="p-2 rounded-full bg-[#1A1A1A] text-[#888888] hover:text-[#F5F5F5] hover:bg-[#2A2A2A] transition-all active:scale-95"><X className="w-6 h-6" /></button>
      </div>

      <div className="flex-1 p-4 flex flex-col items-center justify-center max-w-md mx-auto w-full gap-4">
        <div className="relative w-full aspect-[4/3] bg-[#161616] rounded-3xl overflow-hidden border-2 border-[#C4A484]/50 shadow-2xl flex flex-col items-center justify-center group">
          <div id={scannerContainerId} className="w-full h-full object-cover"></div>
          {isCameraActive && (
            <div className="absolute inset-0 pointer-events-none flex flex-col items-center justify-center p-6">
              <div className="w-full h-0.5 bg-[#C4A484] shadow-[0_0_15px_#C4A484] animate-pulse"></div>
              <div className="absolute top-6 left-6 w-8 h-8 border-t-4 border-l-4 border-[#C4A484] rounded-tl-lg"></div>
              <div className="absolute top-6 right-6 w-8 h-8 border-t-4 border-r-4 border-[#C4A484] rounded-tr-lg"></div>
              <div className="absolute bottom-6 left-6 w-8 h-8 border-b-4 border-l-4 border-[#C4A484] rounded-bl-lg"></div>
              <div className="absolute bottom-6 right-6 w-8 h-8 border-b-4 border-r-4 border-[#C4A484] rounded-br-lg"></div>
              <div className="mt-auto bg-[#0A0A0A]/80 backdrop-blur-md text-[#C4A484] text-xs font-bold px-3 py-1 rounded-full border border-[#C4A484]/30">جاري البحث عن الباركود...</div>
            </div>
          )}
          {cameraError && <div className="p-6 text-center text-[#888888] flex flex-col items-center gap-3"><Camera className="w-12 h-12 text-[#555555]" /><p className="text-xs leading-relaxed max-w-xs">{cameraError}</p></div>}
        </div>

        <div className="w-full">
          <label className="text-xs font-bold text-[#888888] block mb-2 dir-rtl">أنواع الباركود المدعومة (10 أنواع):</label>
          <div className="flex gap-1.5 overflow-x-auto pb-2 scrollbar-none dir-rtl">
            {BARCODE_TYPES.map((bt) => (
              <button key={bt.code} onClick={() => setActiveFormat(bt.code)} className={`px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 transition-all border ${activeFormat === bt.code ? 'bg-[#C4A484] text-[#0A0A0A] border-[#C4A484] font-extrabold shadow-sm' : 'bg-[#1A1A1A] text-[#888888] border-[#2A2A2A] hover:text-[#F5F5F5] hover:bg-[#222222]'}`}>{bt.name}</button>
            ))}
          </div>
        </div>

        <div className="w-full bg-[#161616] border border-[#2A2A2A] rounded-2xl p-4 shadow-xl">
          <form onSubmit={handleManualSubmit} className="flex gap-2">
            <input type="text" value={manualBarcode} onChange={(e) => setManualBarcode(e.target.value)} placeholder="إدخال كود الباركود يدوياً..." className="flex-1 bg-[#1A1A1A] border border-[#2A2A2A] rounded-xl px-3 py-2.5 text-[#F5F5F5] text-xs font-mono placeholder:text-[#666666] focus:outline-none focus:border-[#C4A484] dir-ltr text-left" />
            <button type="submit" className="px-4 py-2.5 bg-[#C4A484] hover:brightness-110 text-[#0A0A0A] rounded-xl text-xs font-bold transition-all shadow-md active:scale-95 shrink-0">مسح</button>
          </form>
          <div className="mt-3 pt-3 border-t border-[#2A2A2A]">
            <span className="text-[11px] font-bold text-[#888888] block mb-2 dir-rtl">أو اختر باركود تجريبي سريع:</span>
            <div className="grid grid-cols-2 gap-1.5 text-xs font-mono">
              {products.slice(0, 4).map((p) => (
                <button key={p.id} onClick={() => handleSelectSampleBarcode(p.barcode, p.barcodeFormat || 'EAN_13')} className="bg-[#1A1A1A] hover:bg-[#222222] border border-[#2A2A2A] hover:border-[#C4A484]/50 text-[#F5F5F5] p-2 rounded-xl text-right transition-all group flex flex-col">
                  <span className="font-sans font-bold text-[11px] text-[#C4A484] truncate w-full">{p.name}</span>
                  <span className="text-[10px] text-[#888888] dir-ltr text-left font-mono mt-0.5">{p.barcode}</span>
                </button>
              ))}
            </div>
          </div>
        </div>

        {scannedResult && (
          <div className="w-full bg-[#161616] border-2 border-[#C4A484] rounded-2xl p-4 text-[#F5F5F5] shadow-2xl animate-scaleUp">
            {scannedResult.product ? (
              <div className="flex items-start justify-between gap-3">
                <div className="flex gap-3">
                  <img src={scannedResult.product.imageUrl} alt={scannedResult.product.name} className="w-14 h-14 rounded-xl object-cover border border-[#C4A484]/50 opacity-90" />
                  <div>
                    <span className="inline-flex items-center gap-1 text-[10px] font-bold text-[#C4A484] bg-[#1A1A1A] px-2 py-0.5 rounded-full border border-[#C4A484]/40 mb-1"><CheckCircle2 className="w-3 h-3" /> تم العثور على المنتج</span>
                    <h4 className="font-bold text-sm text-[#F5F5F5]">{scannedResult.product.name}</h4>
                    <p className="text-xs text-[#888888] font-mono mt-0.5 dir-ltr text-right">الباركود: {scannedResult.product.barcode}</p>
                    <p className="text-xs font-bold text-[#C4A484] mt-1">السعر: {scannedResult.product.piecePrice} ر.س | المخزون: {scannedResult.product.stockQuantity}</p>
                  </div>
                </div>
                <button onClick={() => onScanSuccess(scannedResult.barcode, activeFormat, scannedResult.product)} className="px-3 py-2 bg-[#C4A484] text-[#0A0A0A] font-extrabold text-xs rounded-xl hover:brightness-110 transition-all shadow-md shrink-0">عرض التفاصيل</button>
              </div>
            ) : (
              <div className="flex items-center justify-between gap-3">
                <div>
                  <span className="inline-flex items-center gap-1 text-[10px] font-bold text-amber-400 bg-amber-950 px-2 py-0.5 rounded-full border border-amber-800/50 mb-1"><AlertCircle className="w-3 h-3" /> منتج غير مسجل</span>
                  <h4 className="font-bold text-sm text-[#F5F5F5]">الباركود: {scannedResult.barcode}</h4>
                  <p className="text-xs text-[#888888] mt-0.5">الباركود غير موجود. هل تريد إضافته؟</p>
                </div>
                <button onClick={() => onNavigateToAdd(scannedResult.barcode)} className="flex items-center gap-1 px-3.5 py-2.5 bg-[#C4A484] hover:brightness-110 text-[#0A0A0A] font-extrabold text-xs rounded-xl transition-all shadow-md shrink-0"><Plus className="w-4 h-4 text-[#0A0A0A]" /><span>إضافة منتج</span></button>
              </div>
            )}
          </div>
        )}
      </div>

      <div className="p-3 text-center text-[#888888] text-xs border-t border-[#2A2A2A] bg-[#0E0E0E] dir-rtl">يدعم الماسح الضوئي كاميرا الجوال والخلفية والتقاط الأكواد تلقائياً.</div>
    </div>
  );
}

/* ============================= COMPONENT: StatsModal (local only) ============================= */

function StatsModal({ products, storageStatus, onRefresh, onResetData, onImportData }) {
  const fileInputRef = useRef(null);

  const totalItems = products.length;
  const totalStockQuantity = products.reduce((acc, p) => acc + p.stockQuantity, 0);
  const totalInventoryValue = products.reduce((acc, p) => acc + p.piecePrice * p.stockQuantity, 0);
  const lowStockCount = products.filter((p) => p.stockQuantity > 0 && p.stockQuantity <= 10).length;
  const outOfStockCount = products.filter((p) => p.stockQuantity <= 0).length;
  const healthyStockCount = products.filter((p) => p.stockQuantity > 10).length;

  const handleExportJSON = () => {
    soundFX.playClick();
    const jsonStr = JSON.stringify(products, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `inventory_backup_${new Date().toISOString().slice(0, 10)}.json`; a.click();
    URL.revokeObjectURL(url);
  };

  const handleFileChange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const parsed = JSON.parse(event.target.result);
        if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].name && parsed[0].barcode) {
          if (window.confirm(`هل أنت متأكد من استعادة النسخة الاحتياطية التي تحتوي على (${parsed.length}) منتج؟`)) {
            soundFX.playScanBeep();
            if (onImportData) onImportData(parsed);
          }
        } else { alert('الملف غير صالح أو لا يحتوي على بنية منتجات صحيحة'); }
      } catch (err) { alert('حدث خطأ أثناء قراءة ملف النسخة الاحتياطية'); }
      if (fileInputRef.current) fileInputRef.current.value = '';
    };
    reader.readAsText(file);
  };

  return (
    <div className="pb-28 animate-fadeIn dir-rtl min-h-screen bg-[#0A0A0A] text-[#F5F5F5]">
      <input type="file" ref={fileInputRef} onChange={handleFileChange} accept=".json,application/json" className="hidden" />

      <div className="bg-[#0E0E0E] border-b border-[#2A2A2A] sticky top-0 z-20 p-4 shadow-xs">
        <div className="max-w-md mx-auto flex items-center justify-between">
          <div className="flex items-center gap-2">
            <div className="w-9 h-9 rounded-xl bg-[#1A1A1A] border border-[#2A2A2A] text-[#C4A484] flex items-center justify-center"><Database className="w-5 h-5" /></div>
            <div><h2 className="font-extrabold text-[#F5F5F5] text-base">البيانات والنسخ الاحتياطي</h2><p className="text-xs text-[#888888]">كل البيانات محفوظة محلياً على هذا الجهاز فقط</p></div>
          </div>
          <button onClick={() => { soundFX.playClick(); onRefresh(); }} className="p-2 rounded-xl text-[#888888] hover:text-[#F5F5F5] hover:bg-[#1A1A1A] transition-all" title="تحديث البيانات"><RefreshCw className="w-5 h-5" /></button>
        </div>
      </div>

      <div className="max-w-md mx-auto p-4 space-y-4">
        <div className="bg-[#161616] text-[#F5F5F5] rounded-3xl p-5 shadow-xl space-y-4 border border-[#2A2A2A]">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2.5">
              <div className="w-10 h-10 rounded-2xl bg-[#1A1A1A] border border-[#C4A484]/40 text-[#C4A484] flex items-center justify-center"><HardDrive className="w-6 h-6" /></div>
              <div>
                <h3 className="font-extrabold text-sm text-[#F5F5F5]">التخزين المحلي (IndexedDB) نشط</h3>
                <p className="text-xs text-[#888888]">لا يوجد أي اتصال بالإنترنت أو سحابة خارجية. جميع بياناتك محفوظة فقط على هذا الجهاز.</p>
              </div>
            </div>
          </div>
          <div className="flex items-center gap-2 text-xs pt-2 border-t border-[#2A2A2A] text-amber-300 bg-amber-950/30 p-2.5 rounded-xl border-amber-800/40">
            <Info className="w-4 h-4 shrink-0" />
            <span>ننصح بأخذ نسخة احتياطية JSON بشكل دوري لتجنب فقدان البيانات عند مسح المتصفح.</span>
          </div>

function InstallAppModal({ isOpen, onClose }) {
  const [deferredPrompt, setDeferredPrompt] = useState(null);
  const [isInstalled, setIsInstalled] = useState(false);
  const [activeDeviceTab, setActiveDeviceTab] = useState('android');

  useEffect(() => {
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) setIsInstalled(true);
    const handleBeforeInstall = (e) => { e.preventDefault(); setDeferredPrompt(e); };
    window.addEventListener('beforeinstallprompt', handleBeforeInstall);
    return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstall);
  }, []);

  const handleNativeInstall = async () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') setIsInstalled(true);
      setDeferredPrompt(null);
    }
  };

  if (!isOpen) return null;

  return (
    <div className="fixed inset-0 z-50 bg-[#0A0A0A]/85 backdrop-blur-md flex items-center justify-center p-4 animate-fadeIn dir-rtl text-[#F5F5F5]">
      <div className="bg-[#161616] border border-[#2A2A2A] rounded-3xl max-w-md w-full max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-2xl relative">
        <button onClick={onClose} className="absolute top-4 left-4 p-2 rounded-full bg-[#1A1A1A] text-[#888888] hover:text-[#F5F5F5] hover:bg-[#2A2A2A] transition-all"><X className="w-5 h-5" /></button>
        <div className="flex items-center gap-3">
          <div className="w-12 h-12 rounded-2xl bg-[#1A1A1A] border border-[#C4A484]/40 text-[#C4A484] flex items-center justify-center shrink-0 shadow-md"><Smartphone className="w-6 h-6" /></div>
          <div><h2 className="text-base font-extrabold text-[#F5F5F5]">تثبيت التطبيق على الجوال</h2><p className="text-xs text-[#888888]">تثبيته كتطبيق مستقل يعمل بدون متصفح</p></div>
        </div>
        {isInstalled && <div className="p-3 bg-emerald-950/40 border border-emerald-800/40 text-emerald-300 rounded-2xl text-xs font-bold flex items-center gap-2"><CheckCircle className="w-4 h-4 shrink-0" /><span>التطبيق مثبت بالفعل على جهازك حالياً ويعمل بشكل مستقل!</span></div>}
        <div className="flex bg-[#1F1F1F] p-1 rounded-2xl border border-[#2A2A2A] gap-1 text-xs font-bold">
          <button onClick={() => setActiveDeviceTab('android')} className={`flex-1 py-2 rounded-xl transition-all ${activeDeviceTab === 'android' ? 'bg-[#C4A484] text-[#0A0A0A] shadow-sm font-extrabold' : 'text-[#888888]'}`}>أندرويد (Android)</button>
          <button onClick={() => setActiveDeviceTab('ios')} className={`flex-1 py-2 rounded-xl transition-all ${activeDeviceTab === 'ios' ? 'bg-[#C4A484] text-[#0A0A0A] shadow-sm font-extrabold' : 'text-[#888888]'}`}>آيفون (iOS)</button>
          <button onClick={() => setActiveDeviceTab('apk')} className={`flex-1 py-2 rounded-xl transition-all ${activeDeviceTab === 'apk' ? 'bg-[#C4A484] text-[#0A0A0A] shadow-sm font-extrabold' : 'text-[#888888]'}`}>حزم APK</button>
        </div>

        {activeDeviceTab === 'android' && (
          <div className="space-y-3 bg-[#1F1F1F] p-4 rounded-2xl border border-[#2A2A2A] text-xs">
            <h3 className="font-extrabold text-[#F5F5F5] text-sm flex items-center gap-1.5"><Download className="w-4 h-4 text-[#C4A484]" /><span>خطوات التثبيت على أندرويد (Chrome/Samsung):</span></h3>
            {deferredPrompt && <button onClick={handleNativeInstall} className="w-full py-3 bg-[#C4A484] hover:brightness-110 text-[#0A0A0A] font-extrabold text-xs rounded-xl transition-all shadow-md flex items-center justify-center gap-2"><Download className="w-4 h-4" /><span>اضغط هنا لتثبيت التطبيق بنقرة واحدة!</span></button>}
            <ol className="space-y-2 text-[#888888] list-decimal list-inside pr-1 leading-relaxed">
              <li>افتح الرابط من متصفح <strong className="text-[#F5F5F5]">Google Chrome</strong>.</li>
              <li>اضغط على زر <strong className="text-[#F5F5F5]">القائمة (الثلاث نقاط ⋮)</strong> بأعلى الشاشة.</li>
              <li>اختر <strong className="text-[#C4A484]">"تثبيت التطبيق"</strong> أو <strong className="text-[#C4A484]">"إضافة للشاشة الرئيسية"</strong>.</li>
            </ol>
          </div>
        )}

        {activeDeviceTab === 'ios' && (
          <div className="space-y-3 bg-[#1F1F1F] p-4 rounded-2xl border border-[#2A2A2A] text-xs">
            <h3 className="font-extrabold text-[#F5F5F5] text-sm flex items-center gap-1.5"><Share2 className="w-4 h-4 text-[#C4A484]" /><span>خطوات التثبيت على الآيفون والآيباد (Safari):</span></h3>

              <li>اسحب للأسفل واختر <strong className="text-[#C4A484]">"إضافة إلى الصفحة الرئيسية" (Add to Home Screen)</strong>.</li>
              <li>اضغط على <strong className="text-[#F5F5F5]">"إضافة" (Add)</strong> بالأعلى لتظهر أيقونة التطبيق على شاشتك.</li>
            </ol>
          </div>
        )}

        {activeDeviceTab === 'apk' && (
          <div className="space-y-3 bg-[#1F1F1F] p-4 rounded-2xl border border-[#2A2A2A] text-xs">
            <h3 className="font-extrabold text-[#F5F5F5] text-sm">تحويل التطبيق إلى ملف APK حقيقي:</h3>
            <p className="text-[#888888] leading-relaxed">يمكنك تحويل هذا التطبيق في أي وقت إلى ملف <strong className="text-[#F5F5F5]">APK أو AAB</strong> باستخدام <strong className="text-[#C4A484]">PWABuilder</strong> بعد رفعه على GitHub Pages، للتثبيت اليدوي (Sideload) على جهازك.</p>
          </div>
        )}
      </div>
    </div>
  );
}
